name: Build Documentation

on:
  push:
    branches: ["main", "master"]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  docs:
    name: Sphinx build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Docs build mocks all Qt/PySide6 imports via conf.py - no GUI libs needed.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install package + docs dependencies
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" -e ".[docs]"

      - name: Reject internal material in published documentation
        run: python scripts/check_published_docs.py

      - name: Build HTML documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html --no-color 2>&1

      - name: Run Sphinx linkcheck
        run: |
          sphinx-build -b linkcheck docs docs/_build/linkcheck --no-color 2>&1

      - name: Upload HTML docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14
