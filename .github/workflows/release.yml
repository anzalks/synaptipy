name: Release

on:
  push:
    tags:
      - "v*"          # triggers on v0.1.0b1, v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run: build and test only. Skip TestPyPI, PyPI, and GitHub Release
          publishing. The dist wheel/sdist are uploaded as run artifacts instead.
        type: boolean
        default: true
      pypi_only:
        description: >
          Publish wheel/sdist to TestPyPI and PyPI only (skip waiting for
          installer.yml and skip creating/updating the GitHub Release).
        type: boolean
        default: false

# Top-level permissions are intentionally minimal. Each job that needs
# elevated access declares its own permissions block.
permissions: {}

jobs:
  # ── 1a. Reuse validated Synaptipy CI run on this commit when available ───────
  verify-ci:
    name: Verify Synaptipy CI status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    outputs:
      run_fallback_tests: ${{ steps.ci_check.outputs.run_fallback_tests }}
    steps:
      - name: Check test.yml status for tagged commit
        id: ci_check
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // Poll up to 40 minutes when test.yml was triggered simultaneously
            // (e.g. `git push origin main && git push origin vX.Y.Z`). When
            // dispatched by auto-tag, test.yml is already completed so this
            // finishes on iteration 0 in ~2 seconds. If no test.yml run exists
            // for this SHA after 2 checks (manual tag on unpushed branch), fall
            // back to running the full 3x3 test matrix inside release.yml.
            for (let i = 0; i < 160; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'test.yml',
                head_sha: context.sha,
                per_page: 20,
              });

              const latest = runs.data.workflow_runs[0];
              if (!latest) {
                if (i >= 1) {
                  core.info(`No test.yml run found for ${context.sha}; enabling fallback 3x3 test matrix.`);
                  core.setOutput('run_fallback_tests', 'true');
                  return;
                }
                core.info(`Waiting 15s to check if test.yml queues for ${context.sha}...`);
                await sleep(15000);
                continue;
              }

              if (latest.status === 'completed') {
                if (latest.conclusion === 'success') {
                  core.info(`Verified green test.yml run ${latest.id} for ${context.sha}; skipping duplicate matrix.`);
                  core.setOutput('run_fallback_tests', 'false');
                  return;
                }
                core.setFailed(
                  `test.yml run ${latest.id} for ${context.sha} finished with non-success conclusion: ${latest.conclusion}`
                );
                return;
              }

              core.info(`test.yml run ${latest.id} is ${latest.status} (poll ${i + 1}/160); waiting 15s...`);
              await sleep(15000);
            }

            core.setFailed(`Timed out waiting for test.yml run on ${context.sha}.`);

  # ── 1b. Fallback 3x3 test suite (only if test.yml did not run on this SHA) ──
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: verify-ci
    if: needs.verify-ci.outputs.run_fallback_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libegl1 libxcb-cursor0

      - name: Install package + test deps
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" -r requirements.txt
          uv pip install --system --python "$PY_EXE" -e ".[dev]"

      - name: Lint (syntax errors / undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          python -m pytest -n auto --no-cov -q --tb=short tests/core/ --ignore=tests/core/test_error_handler.py
          NON_CORE_TARGETS="tests/application tests/gui tests/infrastructure tests/shared tests/tooling tests/core/test_error_handler.py"
          if [ "$RUNNER_OS" == "Linux" ]; then
            QT_QPA_PLATFORM=offscreen xvfb-run python -m pytest -p faulthandler --no-cov -q --tb=short $NON_CORE_TARGETS
          else
            QT_QPA_PLATFORM=offscreen python -m pytest -p faulthandler --no-cov -q --tb=short $NON_CORE_TARGETS
          fi

  # ── 1c. Build docs + linkcheck (must pass before release) ───────────────────
  docs:
    name: Docs (Sphinx HTML + linkcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install docs dependencies
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" -e ".[docs]"

      - name: Reject internal material in published documentation
        run: python scripts/check_published_docs.py

      - name: Build HTML documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html --no-color 2>&1

      - name: Run Sphinx linkcheck
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck --no-color 2>&1

  # ── 2. Build wheel + sdist ────────────────────────────────────────────────────
  build:
    name: Build distribution
    needs: [verify-ci, test, docs]
    if: >-
      always() &&
      needs.verify-ci.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.docs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install Linux Qt runtime libraries for qhelpgenerator
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 qt6-tools-dev-tools

      - name: Install build tools and docs dependencies
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" build twine
          uv pip install --system --python "$PY_EXE" -e ".[docs]"

      - name: Build offline Help artefacts (QtHelp + HTML fallback for pip-wheel users)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_offline_help.py

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── 3. Publish to TestPyPI (OIDC Trusted Publisher) ──────────────────────────
  testpypi-publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Note: Do NOT reference `inputs.*` in job-level `if:` (only defined for
    # `workflow_call`, causing `workflow_dispatch` jobs to skip). Use
    # `github.event.inputs.*`, which is populated at both job and step levels.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
    continue-on-error: true
    environment:
      name: testpypi
      url: https://test.pypi.org/p/synaptipy
    permissions:
      id-token: write  # Mandatory for OIDC Trusted Publisher

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── 4. Smoke-test the TestPyPI install ───────────────────────────────────────
  smoke_test_testpypi:
    name: Smoke test from TestPyPI
    needs: testpypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))) &&
      needs.testpypi-publish.result == 'success'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install from TestPyPI and verify import
        run: |
          APP_VERSION=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip

          echo "Waiting for TestPyPI simple index CDN to update..."
          MAX_RETRIES=10
          RETRY_DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Installing synaptipy==$APP_VERSION..."
            if python -m pip install --pre --no-cache-dir "synaptipy==$APP_VERSION" -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/; then
              echo "Install successful!"
              python -c "import synaptipy; print('synaptipy', synaptipy.__version__, 'import OK')"
              exit 0
            fi
            echo "Version not found yet. Waiting $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          done
          echo "Failed to install from TestPyPI after 5 minutes of retries."
          exit 1

  # ── 5. Publish to official PyPI (OIDC Trusted Publisher) ─────────────────────
  pypi-publish:
    name: Publish to PyPI
    needs: smoke_test_testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))) &&
      needs.smoke_test_testpypi.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/synaptipy
    permissions:
      id-token: write  # Mandatory for OIDC Trusted Publisher

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 6. Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.pypi-publish.result == 'success' || needs.pypi-publish.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && (github.event.inputs.pypi_only == 'true' || github.event.inputs.pypi_only == true))
    permissions:
      actions: read
      contents: write   # needed to create/update GitHub Releases

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0               # needed to read full CHANGELOG

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Find installer workflow run for this commit
        id: installer_run
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let run = null;

            // Poll up to 60 minutes (120 * 30s) while installer.yml builds all 4 OS
            // targets, failing immediately if a completed run did not succeed.
            for (let i = 0; i < 120; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'installer.yml',
                head_sha: context.sha,
                per_page: 50,
              });

              const latest = runs.data.workflow_runs[0];
              if (latest && latest.status === 'completed') {
                if (latest.conclusion === 'success') {
                  run = latest;
                  break;
                }
                core.setFailed(
                  `installer.yml run ${latest.id} finished with non-success conclusion: ${latest.conclusion}`
                );
                return;
              }

              const state = latest ? `${latest.status} (id=${latest.id})` : 'not queued yet';
              core.info(`installer.yml status: ${state} (attempt ${i + 1}/120); waiting 30s...`);
              await sleep(30000);
            }

            if (!run) {
              core.setFailed('Timed out waiting for a successful installer.yml workflow run for this commit.');
              return;
            }

            core.info(`Using installer run ID: ${run.id}`);
            core.setOutput('run_id', String(run.id));

      - name: Download Synaptipy-Linux.AppImage artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.installer_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Synaptipy-Linux.AppImage
          path: installer-artifacts/

      - name: Download Synaptipy_Setup.exe artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.installer_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Synaptipy_Setup.exe
          path: installer-artifacts/

      - name: Download Synaptipy-macOS-arm64.dmg artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.installer_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Synaptipy-macOS-arm64.dmg
          path: installer-artifacts/

      - name: Download Synaptipy-macOS-x86_64.dmg artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.installer_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Synaptipy-macOS-x86_64.dmg
          path: installer-artifacts/

      - name: Determine pre-release flag
        id: pre
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qE '[ab]|rc'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=beta-nightly" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "label=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section for this release
        id: changelog
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '^v?[0-9]+\.[0-9]+'; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          fi
          NOTES=$(awk -v tag="## [$TAG]" \
            'index($0, tag)==1{found=1; next} found && /^## \[/{exit} found{print}' \
            CHANGELOG.md 2>/dev/null || echo "See CHANGELOG.md for details.")
          [ -z "$NOTES" ] && NOTES="See CHANGELOG.md for details."
          echo "$NOTES" > release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} (${{ steps.pre.outputs.label }})"
          body_path: release_notes.md
          prerelease: ${{ steps.pre.outputs.prerelease }}
          files: |
            dist/*
            installer-artifacts/**/*.AppImage
            installer-artifacts/**/*.exe
            installer-artifacts/**/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Dry-run: upload dist as run artifact"
        if: github.event_name == 'workflow_dispatch' && !(github.event.inputs.dry_run == 'false' || github.event.inputs.dry_run == false)
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-dist-${{ github.run_id }}
          path: dist/
          retention-days: 7
