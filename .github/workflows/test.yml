name: Synaptipy CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  pull-requests: write
  contents: write

jobs:
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      - name: Install lint tools
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" flake8 'black~=26.1' 'isort~=8.0'

      - name: Check formatting with black and isort
        run: |
          black --check --diff src/ tests/
          isort --check --diff src/ tests/

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/

  test:
    name: Test and Lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml

    - name: Install Linux display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libegl1 libxcb-cursor0

    - name: Install dependencies
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        if [ -f requirements.txt ]; then uv pip install --system --python "$PY_EXE" -r requirements.txt; fi
        uv pip install --system --python "$PY_EXE" \
          pytest pytest-qt pytest-mock pytest-cov pytest-timeout pytest-xdist nbval matplotlib
        uv pip install --system --python "$PY_EXE" -e .

    - name: Run tests with coverage (canonical Linux 3.11 gate)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        xvfb-run python -m pytest -p faulthandler --cov=src/synaptipy --cov-report=term-missing --cov-report=xml --cov-fail-under=90

    - name: Run tests (parallel core + offscreen GUI/integration)
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
      run: |
        python -m pytest -n auto --no-cov -q --tb=short tests/core/ --ignore=tests/core/test_error_handler.py
        NON_CORE_TARGETS="tests/application tests/gui tests/infrastructure tests/shared tests/tooling tests/core/test_error_handler.py"
        if [ "$RUNNER_OS" == "Linux" ]; then
          QT_QPA_PLATFORM=offscreen xvfb-run python -m pytest -p faulthandler --no-cov -q --tb=short $NON_CORE_TARGETS
        else
          QT_QPA_PLATFORM=offscreen python -m pytest -p faulthandler --no-cov -q --tb=short $NON_CORE_TARGETS
        fi

    - name: Coverage Comment
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      # This action only supports push/pull_request/workflow_run events.
      # workflow_dispatch runs (e.g. manual dry-runs) cause it to exit with an
      # error; continue-on-error prevents that from failing the entire job.
      continue-on-error: true
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: unittests
        name: synaptipy-coverage
        fail_ci_if_error: false   # network blip must not block a green build
        disable_search: true      # prevent auto-discovery of python-coverage-comment-action.txt
        verbose: true             # surface any path-matching or processing errors

  # A small, explicitly marked set of layout/plot checks. This avoids
  # repeating every GUI test under a different scale factor while retaining a
  # reliable regression gate for Qt's high-DPI rendering path.
  hidpi:
    name: High-DPI plot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml
    - name: Install Linux display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libegl1 libxcb-cursor0
    - name: Install test dependencies
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        if [ -f requirements.txt ]; then uv pip install --system --python "$PY_EXE" -r requirements.txt; fi
        uv pip install --system --python "$PY_EXE" pytest pytest-qt pytest-mock pytest-cov matplotlib
        uv pip install --system --python "$PY_EXE" -e .
    - name: Run marked high-DPI tests
      timeout-minutes: 8
      env:
        QT_QPA_PLATFORM: offscreen
        QT_SCALE_FACTOR: "2"
      run: |
        xvfb-run python -m pytest -p faulthandler -m hidpi --no-cov -v --tb=short

  # Notebook validation is independent of the application matrix so a slow
  # tutorial execution never conceals a completed core test result.
  notebooks:
    name: Example notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml
    - name: Install Linux display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libegl1 libxcb-cursor0
    - name: Install notebook dependencies
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        if [ -f requirements.txt ]; then uv pip install --system --python "$PY_EXE" -r requirements.txt; fi
        uv pip install --system --python "$PY_EXE" pytest pytest-qt pytest-mock pytest-cov nbval matplotlib
        uv pip install --system --python "$PY_EXE" -e .
    - name: Test example notebooks
      timeout-minutes: 12
      env:
        QT_QPA_PLATFORM: offscreen
        MPLBACKEND: Agg
      run: |
        xvfb-run python -m pytest --no-cov --nbval-lax --maxfail=1 examples/ -v --tb=short

  wheel-install:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Build distribution
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        uv pip install --system --python "$PY_EXE" build twine
        python -m build
        twine check dist/*
    - name: Install wheel in a fresh environment via standard pip
      run: |
        python -m venv /tmp/synaptipy-wheel-test
        /tmp/synaptipy-wheel-test/bin/python -m pip install --upgrade pip
        /tmp/synaptipy-wheel-test/bin/python -m pip install dist/*.whl
        /tmp/synaptipy-wheel-test/bin/python -c "import synaptipy; print(synaptipy.__version__)"

  # ---------------------------------------------------------------------------
  # Minimum-viable slot: oldest supported Python + pinned lower-bound versions.
  # Purpose: catch regressions where newer feature syntax or APIs are used that
  # are not available on the project's stated minimum version.
  # ---------------------------------------------------------------------------
  minimum-viable:
    name: Minimum-viable (Python 3.10, lower-bound deps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml

    - name: Install Linux display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libegl1 libxcb-cursor0

    - name: Install minimum-bound dependencies
      # Install exact lower-bound versions to verify the code works at the
      # stated minimum rather than only at the latest patch release.
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        uv pip install --system --python "$PY_EXE" \
          "numpy==2.0.0" \
          "scipy==1.14.0" \
          "neo==0.14.0" \
          "pyqtgraph==0.13.3" \
          "pyside6==6.7.3" \
          "pandas==2.3.0" \
          flake8 pytest pytest-qt pytest-mock pytest-cov pytest-timeout pytest-xdist
        uv pip install --system --python "$PY_EXE" -e .

    - name: Lint (syntax + undefined names only)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run dependency-compatibility suite
      run: |
        python -m pytest -n auto --no-cov -q --tb=short tests/core/ --ignore=tests/core/test_error_handler.py
        QT_QPA_PLATFORM=offscreen xvfb-run python -m pytest -p faulthandler \
          tests/core/test_error_handler.py \
          tests/gui/test_e2e_gui.py::TestMainWindowInitialisation \
          --timeout=90 -q --tb=short --no-cov

  # ---------------------------------------------------------------------------
  # Security: Bandit static analysis for HIGH-severity vulnerabilities.
  # Scoped to a single matrix slot to keep CI time cheap.
  # Fails if any HIGH-severity issue is found (B2/B3 SAST checks).
  # LOW / MEDIUM findings are reported but do not block the build.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install Bandit
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        uv pip install --system --python "$PY_EXE" bandit

    - name: Run Bandit (fail on HIGH severity)
      run: |
        bandit -r src/synaptipy/ \
          -c bandit.yaml \
          --severity-level high \
          --confidence-level low \
          --format txt

  # ---------------------------------------------------------------------------
  # Latest-dependency slot: newest supported scientific stack. PySide6 remains
  # pinned because its version is an application compatibility requirement.
  # This is a required release gate alongside the minimum-bound dependency job.
  # ---------------------------------------------------------------------------
  latest-dependencies:
    name: Latest dependencies (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml

    - name: Install Linux display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
          libxcb-xfixes0 libegl1 libxcb-cursor0

    - name: Install and upgrade all scientific dependencies
      # Start from requirements.txt then force-upgrade the scientific stack
      # to whatever resolves as latest. pyside6 is intentionally excluded
      # from the upgrade because the 6.7.3 pin is required for stability.
      run: |
        PY_EXE="$(python -c 'import sys; print(sys.executable)')"
        uv pip install --system --python "$PY_EXE" -r requirements.txt
        uv pip install --system --python "$PY_EXE" --upgrade numpy scipy neo pyqtgraph pandas
        uv pip install --system --python "$PY_EXE" flake8 pytest pytest-qt pytest-mock pytest-cov pytest-timeout pytest-xdist
        uv pip install --system --python "$PY_EXE" -e .

    - name: Report installed versions
      run: |
        python -c "import numpy, scipy, neo, pyqtgraph, pandas; \
          print('numpy', numpy.__version__); \
          print('scipy', scipy.__version__); \
          print('neo', neo.__version__); \
          print('pyqtgraph', pyqtgraph.__version__); \
          print('pandas', pandas.__version__)"

    - name: Lint (syntax + undefined names only)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run dependency-compatibility suite
      run: |
        python -m pytest -n auto --no-cov -q --tb=short tests/core/ --ignore=tests/core/test_error_handler.py
        QT_QPA_PLATFORM=offscreen xvfb-run python -m pytest -p faulthandler \
          tests/core/test_error_handler.py \
          tests/gui/test_e2e_gui.py::TestMainWindowInitialisation \
          --timeout=90 -q --tb=short --no-cov

  # ---------------------------------------------------------------------------
  # Auto-tag: create a release tag on main when all required CI passes.
  # Reads the canonical version from pyproject.toml and creates an annotated
  # tag (v<version>) only if that tag does not yet exist.
  # Only runs on direct pushes to main - not on PRs or other branches.
  # ---------------------------------------------------------------------------
  auto-tag:
    name: Auto-tag release
    runs-on: ubuntu-latest
    needs: [lint, test, minimum-viable, latest-dependencies, security, hidpi, notebooks, wheel-install]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history required to check existing remote tags

      - name: Read version and create tag if absent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          TAG="v${VERSION}"
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists - skipping."
            CREATED=false
          else
            echo "Creating tag ${TAG} at $(git rev-parse HEAD)"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git tag -a "${TAG}" -m "Synaptipy ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
            CREATED=true
          fi
          # GitHub does not trigger workflows when GITHUB_TOKEN pushes a tag,
          # so we dispatch installer.yml and release.yml explicitly via the API.
          if [ "$CREATED" = "true" ]; then
            echo "Dispatching installer.yml and release.yml for ${TAG}..."
            gh workflow run installer.yml --ref "refs/tags/${TAG}" -f dry_run=false
            gh workflow run release.yml   --ref "refs/tags/${TAG}" -f dry_run=false
            echo "Dispatched - installer and release workflows are now queued."
          fi
