name: Installer CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run: build all installers and run smoke tests, but skip uploading
          binaries to GitHub Releases. Packaged binaries are available as run
          artifacts from the build job regardless of this setting.
        type: boolean
        default: true

# Minimal default permissions; the build job only needs read access.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch_label }}) Installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: stable supported GitHub-hosted Linux runner.
          - os: ubuntu-22.04
            arch_label: x86_64
            target_arch: ""
            artifact_name: Synaptipy-Linux.AppImage
            artifact_path: dist/*.AppImage
          - os: windows-latest
            arch_label: x64
            target_arch: ""
            artifact_name: Synaptipy_Setup.exe
            artifact_path: Synaptipy_Setup_*.exe
          # Apple Silicon (arm64) native macOS installer
          - os: macos-latest
            arch_label: arm64
            target_arch: arm64
            artifact_name: Synaptipy-macOS-arm64.dmg
            artifact_path: dist/*arm64.dmg
          # Intel (x86_64) native macOS installer
          - os: macos-15-intel
            arch_label: x86_64
            target_arch: x86_64
            artifact_name: Synaptipy-macOS-x86_64.dmg
            artifact_path: dist/*x86_64.dmg

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            pyproject.toml

      # PySide6 loads C extensions during PyInstaller's import analysis phase.
      # Without xcb/xvfb the dynamic loader aborts, producing an incomplete or
      # broken bundle. Install here for all Linux builds, not only smoke tests.
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libegl1 libegl1-mesa libxcb-cursor0 \
            qt6-tools-dev-tools squashfs-tools libfuse2

      - name: Install dependencies
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable)')"
          uv pip install --system --python "$PY_EXE" -r requirements.txt
          uv pip install --system --python "$PY_EXE" -e ".[dev,docs,formats]"

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${APP_VERSION}"

      - name: Build ICNS and ICO
        run: python scripts/build_icons.py

      # Build the Sphinx qthelp output and compile .qch/.qhc artefacts so
      # they land in src/synaptipy/resources/docs/ before PyInstaller runs.
      - name: Build offline Help artefacts
        run: python scripts/build_offline_help.py

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
          SYNAPTIPY_TARGET_ARCH: ${{ matrix.target_arch }}
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
          PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
        run: pyinstaller --noconfirm --clean synaptipy.spec

      - name: Sign and verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Synaptipy.app"
          codesign --verify --all-architectures --deep --strict --verbose=2 "dist/Synaptipy.app"
          plutil -lint "dist/Synaptipy.app/Contents/Info.plist"

      # ── Pre-package binary smoke tests ────────────────────────────────────────
      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a dist/synaptipy/synaptipy --version > /tmp/smoke_version.txt 2>&1
          cat /tmp/smoke_version.txt
          rm -f /tmp/synaptipy_smoke_ok.txt
          if ! SYNAPTIPY_SMOKE_SENTINEL=/tmp/synaptipy_smoke_ok.txt \
            xvfb-run -a dist/synaptipy/synaptipy --smoke-test > /tmp/smoke_gui.txt 2>&1; then
            echo "=== /tmp/smoke_gui.txt ==="
            cat /tmp/smoke_gui.txt || true
            echo "=== ~/.synaptipy/logs ==="
            cat ~/.synaptipy/logs/boot.log ~/.synaptipy/logs/app.log 2>/dev/null || true
            exit 1
          fi
          cat /tmp/smoke_gui.txt
          test -f /tmp/synaptipy_smoke_ok.txt

      - name: Smoke test binary (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Synaptipy.app/Contents/MacOS/synaptipy --version < /dev/null > /tmp/smoke_version.txt 2>&1
          cat /tmp/smoke_version.txt
          rm -f /tmp/synaptipy_smoke_ok.txt
          # Include -psn_0_12345 and detached stdin to emulate Finder / LaunchServices launch
          SYNAPTIPY_SMOKE_SENTINEL=/tmp/synaptipy_smoke_ok.txt \
            dist/Synaptipy.app/Contents/MacOS/synaptipy -psn_0_12345 --smoke-test < /dev/null > /tmp/smoke_gui.txt 2>&1
          cat /tmp/smoke_gui.txt
          test -f /tmp/synaptipy_smoke_ok.txt

      - name: Smoke test binary and MAX_PATH guard (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $distRoot = (Resolve-Path "dist\synaptipy").Path
          $binaryPath = Join-Path $distRoot "synaptipy.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Binary not found: $binaryPath"
            exit 1
          }
          $sizeMB = (Get-Item $binaryPath).Length / 1MB
          Write-Host ("Binary found: {0} ({1:F1} MB)" -f $binaryPath, $sizeMB)
          if ($sizeMB -lt 5) {
            Write-Error ("Binary suspiciously small ({0:F1} MB); packaging may have failed" -f $sizeMB)
            exit 1
          }
          # Guard against Win32 MAX_PATH (260 chars) under per-user AppData\Local\Programs installs
          $maxRelLen = 0
          $longestRel = ""
          Get-ChildItem -Path $distRoot -Recurse -Force | ForEach-Object {
            $rel = $_.FullName.Substring($distRoot.Length).TrimStart('\')
            if ($rel.Length -gt $maxRelLen) {
              $maxRelLen = $rel.Length
              $longestRel = $rel
            }
          }
          Write-Host ("Longest relative bundle path ({0} chars): {1}" -f $maxRelLen, $longestRel)
          if ($maxRelLen -ge 160) {
            Write-Error ("Relative path exceeds 160-char MAX_PATH safety margin ({0} chars): {1}" -f $maxRelLen, $longestRel)
            exit 1
          }
          $sentinel = Join-Path $env:TEMP "synaptipy_smoke_ok.txt"
          if (Test-Path $sentinel) { Remove-Item $sentinel -Force }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SYNAPTIPY_SMOKE_SENTINEL = $sentinel
          $proc = Start-Process -FilePath $binaryPath -ArgumentList "--smoke-test" -PassThru -Wait
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $sentinel)) {
            $logDir = Join-Path $HOME ".synaptipy\logs"
            if (Test-Path $logDir) {
              Get-ChildItem -Path $logDir -File | ForEach-Object {
                Write-Host "=== $($_.FullName) ==="
                Get-Content $_.FullName | Select-Object -Last 80
              }
            }
            Write-Error ("GUI smoke test failed (exit code: {0}, sentinel present: {1})" -f $proc.ExitCode, (Test-Path $sentinel))
            exit 1
          }
          Write-Host "Pre-package Windows smoke test PASSED"

      # ── OS Installer Packaging + Post-Package Verification ────────────────────
      - name: Package and verify installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $VERSION = $Env:APP_VERSION
          Write-Host "Packaging version: $VERSION"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/dMyAppVersion=$VERSION" installer\windows_setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }
          $setupExe = Resolve-Path ("Synaptipy_Setup_{0}.exe" -f $VERSION)
          $installDir = Join-Path $env:TEMP "SynaptipyInstalledVerify"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $installProc = Start-Process -FilePath $setupExe.Path -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/CURRENTUSER",
            "/DIR=$installDir"
          ) -PassThru -Wait
          if ($installProc.ExitCode -ne 0) {
            Write-Error ("Silent installer execution failed with exit code {0}" -f $installProc.ExitCode)
            exit 1
          }
          $installedBinary = Join-Path $installDir "synaptipy.exe"
          if (-not (Test-Path $installedBinary)) {
            Write-Error "Installed binary missing at $installedBinary"
            exit 1
          }
          $sentinel = Join-Path $env:TEMP "synaptipy_installed_smoke_ok.txt"
          if (Test-Path $sentinel) { Remove-Item $sentinel -Force }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SYNAPTIPY_SMOKE_SENTINEL = $sentinel
          $smokeProc = Start-Process -FilePath $installedBinary -ArgumentList "--smoke-test" -PassThru -Wait
          if ($smokeProc.ExitCode -ne 0 -or -not (Test-Path $sentinel)) {
            Write-Error ("Installed binary smoke test failed (exit code: {0}, sentinel: {1})" -f $smokeProc.ExitCode, (Test-Path $sentinel))
            exit 1
          }
          Write-Host "Post-install Windows verification PASSED"

      - name: Package and verify DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v create-dmg >/dev/null 2>&1 || \
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ matrix.arch_label }}"
          EXPECTED_ARCH="${{ matrix.target_arch }}"
          DMG_PATH="dist/Synaptipy_${VERSION}_macOS_${ARCH}.dmg"
          rm -f "${DMG_PATH}"

          # Use --skip-jenkins directly on headless CI runners so Finder AppleScript
          # window styling does not stall for ~2-3 minutes before timing out.
          create-dmg \
            --volname "Synaptipy Installer (${ARCH})" \
            --skip-jenkins \
            --no-internet-enable \
            --app-drop-link 600 185 \
            "${DMG_PATH}" \
            "dist/Synaptipy.app"

          codesign --force --sign - "${DMG_PATH}"

          MOUNT_DIR="$(mktemp -d /tmp/synaptipy_dmg_mount.XXXXXX)"
          cleanup_mount() {
            hdiutil detach "${MOUNT_DIR}" -force -quiet 2>/dev/null || true
            rmdir "${MOUNT_DIR}" 2>/dev/null || true
          }
          trap cleanup_mount EXIT

          hdiutil attach "${DMG_PATH}" -mountpoint "${MOUNT_DIR}" -nobrowse -readonly -quiet
          codesign --verify --all-architectures --deep --strict --verbose=2 "${MOUNT_DIR}/Synaptipy.app"
          ACTUAL_ARCHS="$(lipo -archs "${MOUNT_DIR}/Synaptipy.app/Contents/MacOS/synaptipy")"
          echo "Mounted binary architectures: ${ACTUAL_ARCHS} (expected: ${EXPECTED_ARCH})"
          if [ "${ACTUAL_ARCHS}" != "${EXPECTED_ARCH}" ]; then
            echo "ERROR: Mounted binary architecture '${ACTUAL_ARCHS}' does not match '${EXPECTED_ARCH}'"
            exit 1
          fi

      - name: Package and verify AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ env.APP_VERSION }}"

          # 1. Create the AppDir structure required by AppImage
          rm -rf AppDir
          mkdir -p AppDir/usr/bin

          # 2. Copy the PyInstaller output into the AppDir
          cp -r dist/synaptipy/* AppDir/usr/bin/

          # 3. Copy the desktop file and icon to the root of AppDir
          cp installer/linux/synaptipy.desktop AppDir/
          cp src/synaptipy/resources/icons/logo.png AppDir/synaptipy.png

          # 4. Write POSIX AppRun wrapper with Wayland-to-XWayland (xcb) fallback
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          if [ -z "${QT_QPA_PLATFORM:-}" ] && [ -n "${WAYLAND_DISPLAY:-}" ] && [ -n "${DISPLAY:-}" ]; then
            export QT_QPA_PLATFORM="xcb"
          fi
          exec "${HERE}/usr/bin/synaptipy" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 5. Download the AppImage runtime
          echo "Downloading AppImage runtime..."
          if ! wget --tries=5 --waitretry=5 --retry-connrefused -O runtime https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64; then
            echo "ERROR: Failed to download AppImage runtime"
            exit 1
          fi
          chmod +x runtime
          echo "Runtime downloaded: $(stat -c%s runtime) bytes"

          # 6. Build the squashfs filesystem across all available CPU cores
          echo "System mksquashfs version:"
          mksquashfs -version

          echo "Creating squashfs filesystem..."
          if ! mksquashfs AppDir AppDir.squashfs -root-owned -noappend -comp zstd -Xcompression-level 15 -b 1M -mkfs-time 0 -processors "$(nproc)"; then
            echo "ERROR: mksquashfs failed"
            exit 1
          fi
          echo "Squashfs created: $(stat -c%s AppDir.squashfs) bytes"

          # 7. Combine runtime + squashfs to create the final AppImage
          APPIMAGE_PATH="dist/Synaptipy-${VERSION}-x86_64.AppImage"
          echo "Combining runtime + squashfs..."
          cat runtime AppDir.squashfs > "${APPIMAGE_PATH}"
          chmod +x "${APPIMAGE_PATH}"

          # 8. Verify the AppImage file and execute full GUI smoke test from inside it
          if [ ! -f "${APPIMAGE_PATH}" ]; then
            echo "ERROR: AppImage file not created"
            exit 1
          fi
          SIZE=$(stat -c%s "${APPIMAGE_PATH}")
          echo "AppImage created successfully: $(($SIZE / 1024 / 1024)) MB"
          file "${APPIMAGE_PATH}"

          rm -f /tmp/synaptipy_appimage_smoke_ok.txt
          if ! QT_QPA_PLATFORM=offscreen SYNAPTIPY_SMOKE_SENTINEL=/tmp/synaptipy_appimage_smoke_ok.txt \
            xvfb-run -a "./${APPIMAGE_PATH}" --appimage-extract-and-run --smoke-test > /tmp/smoke_appimage.txt 2>&1; then
            echo "=== /tmp/smoke_appimage.txt ==="
            cat /tmp/smoke_appimage.txt || true
            echo "=== ~/.synaptipy/logs ==="
            cat ~/.synaptipy/logs/boot.log ~/.synaptipy/logs/app.log 2>/dev/null || true
            exit 1
          fi
          cat /tmp/smoke_appimage.txt
          test -f /tmp/synaptipy_appimage_smoke_ok.txt
          echo "Post-package Linux AppImage verification PASSED"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
