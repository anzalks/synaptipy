name: Installer CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run: build all installers and run smoke tests, but skip uploading
          binaries to GitHub Releases.  Packaged binaries are available as run
          artifacts from the build job regardless of this setting.
        type: boolean
        default: true

# Minimal default permissions; the build job only needs read access.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch_label }}) Installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    # Default all run: blocks to bash so that grep/cut/echo work on every
    # platform.  Steps that must use PowerShell (Windows packaging) override
    # this explicitly with `shell: powershell`.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: stable supported GitHub-hosted Linux runner.
          - os: ubuntu-22.04
            arch_label: x86_64
            target_arch: ""
            artifact_name: Synaptipy-Linux.AppImage
            artifact_path: dist/*.AppImage
          - os: windows-latest
            arch_label: x64
            target_arch: ""
            artifact_name: Synaptipy_Setup.exe
            artifact_path: Synaptipy_Setup_*.exe
          # Apple Silicon (arm64) native macOS installer
          - os: macos-latest
            arch_label: arm64
            target_arch: arm64
            artifact_name: Synaptipy-macOS-arm64.dmg
            artifact_path: dist/*arm64.dmg
          # Intel (x86_64) native macOS installer
          - os: macos-15-intel
            arch_label: x86_64
            target_arch: x86_64
            artifact_name: Synaptipy-macOS-x86_64.dmg
            artifact_path: dist/*x86_64.dmg

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # PySide6 loads C extensions during PyInstaller's import analysis phase.
      # Without xcb/xvfb the dynamic loader aborts, producing an incomplete or
      # broken bundle.  Install here for all Linux builds, not only smoke tests.
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libegl1 libegl1-mesa libxcb-cursor0 \
            qt6-tools-dev-tools squashfs-tools libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,formats]" -r requirements.txt

      # Export APP_VERSION once using bash grep/cut so that every subsequent
      # packaging step can reference ${{ env.APP_VERSION }} regardless of OS.
      # This avoids duplicating the grep/cut idiom in each platform block and
      # removes any risk of it being run under PowerShell (which lacks grep).
      - name: Read app version
        shell: bash
        run: |
          APP_VERSION=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${APP_VERSION}"

      - name: Build ICNS and ICO
        run: python scripts/build_icons.py

      # Build the Sphinx qthelp output and compile .qch/.qhc artefacts so
      # they land in src/synaptipy/resources/docs/ before PyInstaller runs.
      # On macOS/Windows the qhelpgenerator binary is shipped inside the
      # pyside6 wheel (already installed above); on Linux we install the
      # system qt6-tools-dev-tools package (see step above).
      - name: Build offline Help artefacts
        run: python scripts/build_offline_help.py

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
          SYNAPTIPY_TARGET_ARCH: ${{ matrix.target_arch }}
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
          PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
        run: pyinstaller --noconfirm --clean synaptipy.spec

      - name: Sign and verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Synaptipy.app"
          codesign --verify --all-architectures --deep --strict --verbose=2 "dist/Synaptipy.app"
          plutil -lint "dist/Synaptipy.app/Contents/Info.plist"

      # ── Smoke tests: verify both CLI version and full GUI MainWindow bootstrap ─
      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a dist/synaptipy/synaptipy --version > /tmp/smoke_version.txt 2>&1
          cat /tmp/smoke_version.txt
          rm -f /tmp/synaptipy_smoke_ok.txt
          SYNAPTIPY_SMOKE_SENTINEL=/tmp/synaptipy_smoke_ok.txt \
            xvfb-run -a dist/synaptipy/synaptipy --smoke-test > /tmp/smoke_gui.txt 2>&1
          cat /tmp/smoke_gui.txt
          test -f /tmp/synaptipy_smoke_ok.txt

      - name: Smoke test binary (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Synaptipy.app/Contents/MacOS/synaptipy --version < /dev/null > /tmp/smoke_version.txt 2>&1
          cat /tmp/smoke_version.txt
          rm -f /tmp/synaptipy_smoke_ok.txt
          # Include -psn_0_12345 and detached stdin to emulate Finder / LaunchServices launch
          SYNAPTIPY_SMOKE_SENTINEL=/tmp/synaptipy_smoke_ok.txt \
            dist/Synaptipy.app/Contents/MacOS/synaptipy -psn_0_12345 --smoke-test < /dev/null > /tmp/smoke_gui.txt 2>&1
          cat /tmp/smoke_gui.txt
          test -f /tmp/synaptipy_smoke_ok.txt

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $binaryPath = "dist\synaptipy\synaptipy.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Binary not found: $binaryPath"
            exit 1
          }
          $sizeMB = (Get-Item $binaryPath).Length / 1MB
          Write-Host ("Binary found: {0} ({1:F1} MB)" -f $binaryPath, $sizeMB)
          if ($sizeMB -lt 5) {
            Write-Error ("Binary suspiciously small ({0:F1} MB); packaging may have failed" -f $sizeMB)
            exit 1
          }
          $sentinel = Join-Path $env:TEMP "synaptipy_smoke_ok.txt"
          if (Test-Path $sentinel) { Remove-Item $sentinel -Force }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SYNAPTIPY_SMOKE_SENTINEL = $sentinel
          $proc = Start-Process -FilePath $binaryPath -ArgumentList "--smoke-test" -PassThru -Wait
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $sentinel)) {
            Write-Error ("GUI smoke test failed (exit code: {0}, sentinel present: {1})" -f $proc.ExitCode, (Test-Path $sentinel))
            exit 1
          }
          Write-Host "Smoke test PASSED"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # APP_VERSION was exported to $GITHUB_ENV by the 'Read app version'
          # bash step above; PowerShell reads it from the process environment.
          $VERSION = $Env:APP_VERSION
          Write-Host "Packaging version: $VERSION"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/dMyAppVersion=$VERSION" installer\windows_setup.iss

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ matrix.arch_label }}"
          create-dmg \
            --volname "Synaptipy Installer (${ARCH})" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Synaptipy.app" 200 190 \
            --hide-extension "Synaptipy.app" \
            --app-drop-link 600 185 \
            "dist/Synaptipy_${VERSION}_macOS_${ARCH}.dmg" \
            "dist/Synaptipy.app"

      - name: Package for Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ env.APP_VERSION }}"

          # 1. Create the AppDir structure required by AppImage
          mkdir -p AppDir/usr/bin

          # 2. Copy the PyInstaller output into the AppDir
          cp -r dist/synaptipy/* AppDir/usr/bin/

          # 3. Copy the desktop file and icon to the root of AppDir
          cp installer/linux/synaptipy.desktop AppDir/
          cp src/synaptipy/resources/icons/logo.png AppDir/synaptipy.png

          # 4. Create the standard AppRun symlink pointing to our binary
          cd AppDir
          ln -s usr/bin/synaptipy AppRun
          cd ..

          # 5. Download the AppImage runtime
          # Using the manual squashfs method instead of appimagetool to avoid
          # glibc compatibility issues. The runtime from 'continuous' release is
          # actively maintained and compatible with ubuntu-22.04.
          echo "Downloading AppImage runtime..."
          if ! wget -O runtime https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64; then
            echo "ERROR: Failed to download AppImage runtime"
            exit 1
          fi
          chmod +x runtime
          echo "Runtime downloaded: $(stat -c%s runtime) bytes"

          # 6. Build the squashfs filesystem
          echo "System mksquashfs version:"
          mksquashfs -version

          echo "Creating squashfs filesystem..."
          if ! mksquashfs AppDir AppDir.squashfs -root-owned -noappend -comp xz -Xbcj x86 -b 1M -mkfs-time 0; then
            echo "ERROR: mksquashfs failed"
            exit 1
          fi
          echo "Squashfs created: $(stat -c%s AppDir.squashfs) bytes"

          # 7. Combine runtime + squashfs to create the final AppImage
          echo "Combining runtime + squashfs..."
          cat runtime AppDir.squashfs > "dist/Synaptipy-${VERSION}-x86_64.AppImage"
          chmod +x "dist/Synaptipy-${VERSION}-x86_64.AppImage"

          # 8. Verify the AppImage was created
          if [ -f "dist/Synaptipy-${VERSION}-x86_64.AppImage" ]; then
            SIZE=$(stat -c%s "dist/Synaptipy-${VERSION}-x86_64.AppImage")
            echo "AppImage created successfully: $(($SIZE / 1024 / 1024)) MB"
            file "dist/Synaptipy-${VERSION}-x86_64.AppImage"
          else
            echo "ERROR: AppImage file not created"
            exit 1
          fi

      - name: Upload installer artifact
        # if-no-files-found: error surfaces packaging failures immediately
        # rather than silently uploading an empty artifact that later causes
        # the release job to attach zero binaries to the GitHub Release.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
